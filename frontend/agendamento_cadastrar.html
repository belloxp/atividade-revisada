<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <script src="./sessao.js" defer></script>
    <script src="./agendamento_cadastrar.js" defer></script>
    <title>Cadastrar Agendamento - PixelFix</title>
</head>
<body>
    <header>
        <nav>
            <a href="./index.html">Home</a>&emsp;
            <a href="#" onclick="logout()">Sair</a>
        </nav>
        <br><hr><br>
    </header>
    <main>
        <h1>Cadastrar Agendamento</h1>
        <form>
            <label for="data">Data</label><br>
            <input type="date" id="data" required><br><br>

            <label for="hora">Horário</label><br>
            <input type="time" id="hora" required><br><br>

            <label for="codCliente">Código do Cliente</label><br>
            <input type="number" id="codCliente" required><br><br>

            <label for="codConsole">Código do Console</label><br>
            <input type="number" id="codConsole" required><br><br>

            <button id="btn_cadastrar">Cadastrar</button>
        </form>
        <div id="resposta" class="resposta"></div>
    </main>
</body>
</html>
