<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <script src="./sessao.js" defer></script>
    <script src="./cliente_atualizar.js" defer></script>
    <title>Atualizar Cliente - PixelFix</title>
</head>
<body>
    <header>
        <nav>
            <a href="./index.html">Home</a>&emsp;
            <a href="#" onclick="logout()">Sair</a>
        </nav>
        <br><hr><br>
    </header>
    <main>
        <h1>Atualizar Cliente</h1>
        <form>
            <label for="id">Código do Cliente</label><br>
            <input type="number" id="id" required><br><br>

            <label for="nome">Nome</label><br>
            <input type="text" id="nome" required><br><br>

            <label for="email">E-mail</label><br>
            <input type="email" id="email" required><br><br>

            <label for="telefone">Telefone celular</label><br>
            <input type="text" id="telefone" required><br><br>

            <label for="senha">Nova senha (opcional)</label><br>
            <input type="password" id="senha"><br><br>

            <label for="cpf">Novo CPF (opcional)</label><br>
            <input type="text" id="cpf"><br><br>

            <button id="btn_atualizar">Atualizar</button>
        </form>
        <div id="resposta" class="resposta"></div>
    </main>
</body>
</html>
